title = "KonkourX repository secret scanning"
minVersion = "8.30.1"

[extend]
useDefault = true

# These are curriculum identifiers, not credentials. Each exception is bound
# to the generic rule, a reviewed path, and the exact line shape that triggered
# the audited false positive. Provider-specific rules remain fully enabled.

[[allowlists]]
description = "Experimental curriculum source record UUIDs"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "line"
paths = ['''^apps/api/src/curriculum/data/experimental-sciences\.ts$''']
regexes = ['''\bsourceRecordKey:\s*'src-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}'(?:,|\s)''']

[[allowlists]]
description = "Audited JSON-shaped curriculum source record UUIDs"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "line"
paths = [
  '''^apps/api/src/curriculum/data/human-sciences\.ts$''',
  '''^apps/api/src/curriculum/data/mathematics-physics\.ts$''',
  '''^docs/curriculum/CURRICULUM_AUDIT_REPORT\.json$''',
  '''^docs/curriculum/CURRICULUM_FREEZE_MANIFEST\.json$''',
]
regexes = ['''^\s*"sourceRecordKey":\s*"src-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}",?\s*$''']

[[allowlists]]
description = "Pilot Arabic taxonomy vocabulary identifier"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "line"
paths = ['''^apps/api/src/curriculum/data/pilot-arabic10-lesson1\.ts$''']
regexes = ['''^\s*subKeyVocabulary:\s*'tax-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}',?\s*$''']

[[allowlists]]
description = "Audited psychology representation identity"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "line"
paths = ['''^apps/api/src/curriculum/generated/canonical-curriculum-identities\.v1\.json$''']
regexes = ['''^\s*"logicalKey":\s*"representation/psychology",?\s*$''']

[[allowlists]]
description = "Biology sequence definition keys"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "line"
paths = ['''^apps/api/src/curriculum/representation-definitions\.ts$''']
regexes = ['''^\s*\{\s*key:\s*'biology-sequence-[1-3]',\s*startEntry:\s*[0-9]+\s*\},?\s*$''']

[[allowlists]]
description = "Curriculum authoring fixture identifiers"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "line"
paths = ['''^apps/api/test/curriculum-authoring-conversion\.test\.ts$''']
regexes = ['''^\s*const\s+(?:ambiguousKey\s*=\s*'src-fixture-unresolved-03'|childKey\s*=\s*'src-fixture-child-02'|rootKey\s*=\s*'src-fixture-root-01')\s*$''']

[[allowlists]]
description = "Completed Physics review taxonomy target UUIDs"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "line"
paths = ['''^docs/curriculum/PHYSICS12_MOTION_REVIEW_INPUT\.completed\.json$''']
regexes = ['''^\s*"targetKey":\s*"tax-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}",?\s*$''']
